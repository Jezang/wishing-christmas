<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard | Christmas Wishing Village</title><link rel="stylesheet" href="style.css"><style>.teacher{max-width:1150px;margin:25px auto;padding:20px}.teacher-head{background:#fff;border:3px solid #d8eee4;border-radius:25px;padding:22px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tabs button{border-radius:20px;padding:12px 18px;background:#fbe5ec;color:#845b69;font-weight:800}.tabs button.active{background:#ee8eaa;color:#fff}.review{display:grid;gap:12px}.review article{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#fff;border:2px solid #f3d9e1;border-radius:20px;padding:16px}.review .info{flex:1;min-width:220px;overflow-wrap:anywhere}.review strong{color:#b35b76}.review .btns{display:flex;gap:8px;flex-wrap:wrap}.review .btns button{padding:10px 14px;border-radius:20px;font-weight:800}.approve{background:#bdebd5}.reject{background:#f8d1da}.delete{background:#eee}.teacher input{padding:10px;border:2px solid #e6d6d9;border-radius:12px;max-width:100%}</style></head><body><header class="top"><a class="logo" href="./">🎄 Christmas <span>Wishing Village</span></a><strong>👩‍🏫 Teacher Dashboard</strong><a href="./">← Student site</a></header><main class="teacher"><div class="teacher-head"><h1>💌 ตรวจสอบคำอวยพรของนักเรียน</h1><p>ครูอนุมัติก่อนข้อความปรากฏบนต้นไม้ร่วมกัน • เข้าสู่ระบบด้วยบัญชีครู</p><form id="login"><input id="email" type="email" placeholder="อีเมลครู" required><input id="password" type="password" placeholder="รหัสผ่าน" required><button class="white">เข้าสู่ระบบ</button></form><button id="logout" class="white" hidden>ออกจากระบบ</button><div id="counts"></div></div><div class="tabs"><button data-status="pending" class="active">⏳ รออนุมัติ</button><button data-status="approved">✅ อนุมัติแล้ว</button><button data-status="rejected">❌ ไม่อนุมัติ</button></div><label>ค้นหาจากรายการที่โหลด <input id="search" placeholder="ชื่อ / ห้อง / ผู้รับ / คำอวยพร"></label><div id="notice" role="status" aria-live="polite"></div><div id="reviews" class="review"></div><div class="controls" style="margin-top:20px"><button id="next" class="white">โหลดเพิ่มอีก 30 รายการ</button><button id="refresh" class="white">🔄 รีเฟรช</button></div><section id="manager" hidden class="teacher-head"><h2>🎵 Music Manager</h2><p>เพิ่มเพลงส่วนกลางได้ 30 เพลงเพิ่มเติมจากรายการเดิม</p><form id="musicForm"><label>ชื่อเพลง<input id="musicTitle" maxlength="100" required></label><label>ศิลปิน<input id="musicArtist" maxlength="100" required></label><label>ลิงก์เพลง<input id="musicUrl" type="url" required></label><label>หมวด<select id="musicGenre"><option>Pop</option><option>Cozy</option><option>K-Pop</option><option>Classics</option><option>Piano</option></select></label><button class="white">บันทึกเพลง</button><button type="button" id="cancelMusic" class="white">ยกเลิก</button></form><button id="loadMusic" class="white">โหลด / รีเฟรช Playlist</button><p id="musicNotice" role="status"></p><div id="managedSongs" class="review"></div></section><section id="snowReview" hidden class="teacher-head"><h2>⛄ Snowman Gallery moderation</h2><label>สถานะ<select id="snowReviewStatus"><option value="pending">รออนุมัติ</option><option value="approved">อนุมัติแล้ว</option><option value="rejected">ไม่อนุมัติ</option></select></label><button id="snowReviewLoad" class="white">โหลด / รีเฟรช</button><div id="snowReviewGrid" class="snow-grid"></div><p id="snowReviewNotice" role="status"></p><button id="snowReviewMore" class="white">โหลดเพิ่ม 20 ตัว</button></section></main><script type="module" src="teacher.js"></script><script type="module" src="gallery-teacher.js"></script></body></html>
