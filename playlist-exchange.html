<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Christmas Playlist Exchange</title><style>*{box-sizing:border-box}body{margin:0;background:#faf5f3;color:#654955;font:16px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px}header,section,article{background:white;border:1px solid #eadce4;border-radius:20px;padding:20px;margin-bottom:16px}h1{font:600 clamp(27px,5vw,40px) Georgia,serif;color:#a64f68;margin:12px 0}h2{font-size:20px;font-weight:600}label{display:block;margin:12px 0}input,textarea,select{display:block;width:100%;font:inherit;padding:10px;border:1px solid #dbc8d0;border-radius:10px}button,a.link{display:inline-block;font:inherit;background:#e2f2e9;color:#356c59;border:0;border-radius:10px;padding:10px 14px;margin:4px;cursor:pointer;text-decoration:none}a{color:#89536b}article{background:#fff0f5;overflow-wrap:anywhere}article p{white-space:pre-wrap}#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}#list article{margin:0}[hidden]{display:none!important}</style><main><header><a href="./">← Christmas Village</a><h1>Christmas Playlist Exchange</h1><p>Share the music, share the joy. · แบ่งปันเพลงโปรดให้เพื่อน</p></header><section id="student"><h2>แนะนำเพลย์ลิสต์ของคุณ</h2><form id="form"><label>ชื่อเพลย์ลิสต์<input id="title" maxlength="80" required></label><label>ชื่อเล่น<input id="name" maxlength="30" required></label><label>Spotify หรือ YouTube Playlist URL<input id="url" type="url" required maxlength="500" placeholder="https://open.spotify.com/playlist/..."></label><label>ข้อความแนะนำ (ไม่บังคับ)<textarea id="message" maxlength="160"></textarea></label><button>ส่งให้ครูอนุมัติ</button></form></section><section id="admin" hidden><h2>ตรวจสอบเพลย์ลิสต์</h2><a href="teacher.html">กลับ Teacher Dashboard / เข้าสู่ระบบ</a><label>สถานะ<select id="filter"><option value="pending">รออนุมัติ</option><option value="approved">อนุมัติแล้ว</option><option value="rejected">ไม่อนุมัติ</option></select></label></section><section><h2 id="heading">เพลย์ลิสต์แนะนำจากเพื่อน</h2><p id="notice" role="status"></p><button id="refresh">รีเฟรช</button><div id="list"></div><button id="more" hidden>โหลดเพิ่มเติม</button></section></main><script src="success-notice.js?v=68"></script><script type="module" src="playlist-exchange.js?v=68"></script></html>
